# Yierdis 启动配置文件
#
# 用法：java -jar yierdis-server-0.1.0-SNAPSHOT.jar            # 默认读取 ./yierdis.conf
#       java -jar yierdis-server-0.1.0-SNAPSHOT.jar --config /path/to/yierdis.conf
#
# 规则：
#   - 格式为 Java Properties（key=value，`#`/`!` 开头为注释）。
#   - 未知键启动即报错，拼错的键不会静默失效。
#   - maxmemoryBytes 必须显式给出（唯一必填键），其余键缺省时取下方注释里的默认值。
#   - 配置键的完整约束见 docs/project-docs/configuration-and-operations.md。

# ===== 必填 =====

# 实例内存预算（字节）。0 = 明确承认不限制内存。
maxmemoryBytes=0

# ===== 网络与实例规模 =====

#bind=127.0.0.1
#port=6378
#maxClients=1024
#databases=16
#ioThreads=1

# ===== 协议入口限制 =====

# 单条 bulk body 上限（字节）。
#protocolMaxBulkBytes=536870912
# 单条请求最大参数个数。
#protocolMaxArgs=1048576
# header/inline 行长度上限（字节）。
#protocolMaxLineBytes=1048576
# 单条命令 heap footprint 估算上限（字节）。
#protocolMaxCommandBytes=67108864
# ingress 全局在途字节预算；0 = 派生为 max(128 MiB, 2 × executorQueueMaxBytes)。
#protocolGlobalInFlightBytes=0

# ===== executor 与背压 =====

# 全局 backlog 任务数硬上限。
#executorQueueCapacity=1024
# 全局 backlog 字节预算；0 = 关闭字节预算，只按任务数限制。
#executorQueueMaxBytes=67108864
# 调度策略：fair | global。
#executorSchedulingPolicy=fair
# 单连接背压高/低水位（未完成任务数）。
#backpressureHigh=256
#backpressureLow=128
# 单连接背压高/低水位（字节）。
#backpressureBytesHigh=16777216
#backpressureBytesLow=8388608
# 单轮 drain 最多处理的命令数 / 时间预算（毫秒）。
#executorMaxDrain=512
#executorDrainMillis=2

# ===== transaction 队列 =====

# 单连接 MULTI/EXEC 队列上限；0 = 禁用对应限制。
#transactionQueueMaxCommands=1024
#transactionQueueMaxBytes=67108864

# ===== 连接保护与空闲 =====

# 读空闲超时（毫秒）；0 = 不因空闲主动断开。
#client-idle-timeout-millis=0
# 慢客户端输出缓冲上限（字节）；0 = 不覆盖 Netty 默认 watermark。
#client-output-buffer-limit-bytes=67108864
# 超过缓冲上限后的宽限期（毫秒）；limit>0 时必须大于 0。
#client-output-buffer-over-limit-millis=10000

# ===== responder reply 准入（硬容量） =====

# 全局 / 单连接 reply 容量（字节）。
#replyGlobalCapacityBytes=268435456
#replyPerConnectionCapacityBytes=134217728
# 单条回复最大计费字节。
#replyMaxTotalBytes=67108864
# 单个 chunk 的 payload 字节。
#replyChunkPayloadBytes=65536
# 每条回复的控制字节预留。
#replyControlReservationBytes=4096
# graceful shutdown 回复排空上限（毫秒）。
#replyDrainTimeoutMillis=5000

# ===== TTL 与 maintenance =====

# maintenance tick 周期（毫秒）；0 等同于 noCleanup=true（周期 expire cleanup 关闭，
# 仅保留延迟回收 tick）。
#cleanupIntervalMillis=1000
#noCleanup=false
# 单次 expire cleanup 时间预算（毫秒）。
#expireCleanupTimeLimitMillis=5

# ===== native defrag =====

#nativeDefragEnabled=false
# 单次 defrag 的移动字节 / 对象数 / 时间预算。
#nativeDefragMaxMoveBytes=65536
#nativeDefragMaxObjects=64
#nativeDefragTimeLimitMillis=1
# native object slot 容量覆盖；0 = 保留默认。
#nativeSlotCapacity=0

# ===== maxmemory 与 eviction =====

# global | per-db（接受 perdb / per_db 拼法；global 由 governor 跨 DB 协调预算，
# per-db 把 maxmemoryBytes 按 DB 数硬分摊）。
#maxmemoryScope=global
# noeviction | allkeys-random | allkeys-lru。
#maxmemoryPolicy=noeviction
# eviction 采样数。
#maxmemorySamples=5
# 单次 eviction 时间预算（毫秒）。
#evictionTimeLimitMillis=5

# ===== KEYS 保护 =====

# KEYS 时间预算（毫秒）；0 = 不限。
#keysTimeBudgetMillis=0
# KEYS 最大返回条数；0 = 禁用 KEYS。
#keysMaxResults=2147483647
