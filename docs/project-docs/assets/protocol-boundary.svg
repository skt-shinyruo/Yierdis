<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="520" viewBox="0 0 1160 520" role="img" aria-labelledby="title desc">
  <title id="title">RESP protocol boundary</title>
  <desc id="desc">A diagram showing RESP array and inline requests entering decoder and adapter, becoming ExecutionRequest for command execution, then ReplyWriter output encoded as RESP2 or RESP3 replies.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2d5f85"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { fill: #0f172a; font: 700 28px sans-serif; }
      .text { fill: #0f172a; font: 15px sans-serif; }
      .mono { fill: #0f172a; font: 14px monospace; }
      .small { fill: #475569; font: 13px sans-serif; }
      .box { fill: #eef6fb; stroke: #2d5f85; stroke-width: 1.5; rx: 12; }
      .exec { fill: #f2f8ed; stroke: #4f7d3a; stroke-width: 1.5; rx: 12; }
      .reply { fill: #fff6e8; stroke: #9a6b1f; stroke-width: 1.5; rx: 12; }
      .error { fill: #fef2f2; stroke: #b91c1c; stroke-width: 1.5; rx: 12; }
      .arrow { stroke: #2d5f85; stroke-width: 2; marker-end: url(#arrow); fill: none; }
      .err-arrow { stroke: #b91c1c; stroke-width: 2; marker-end: url(#arrow); fill: none; stroke-dasharray: 7 5; }
      .boundary { stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 7 6; }
    </style>
  </defs>
  <rect class="bg" width="1160" height="520"/>
  <text class="title" x="40" y="42">RESP Protocol Boundary</text>
  <text class="small" x="40" y="70">Wire protocol stays at decode and reply encoding boundaries; command execution uses ExecutionRequest and ReplyWriter.</text>

  <rect class="box" x="55" y="120" width="220" height="95"/>
  <text class="text" x="90" y="150">RESP array request</text>
  <text class="mono" x="83" y="180">*2\r\n$3\r\nGET...</text>
  <text class="small" x="84" y="199">binary-safe client path</text>

  <rect class="box" x="55" y="265" width="220" height="95"/>
  <text class="text" x="92" y="295">Inline command</text>
  <text class="mono" x="92" y="325">PING\r\n</text>
  <text class="small" x="84" y="344">manual / redis-cli compatible</text>

  <rect class="box" x="340" y="180" width="220" height="95"/>
  <text class="text" x="385" y="210">RespRequestDecoder</text>
  <text class="small" x="382" y="235">limits + framing</text>
  <text class="small" x="382" y="254">protocol errors stay here</text>

  <rect class="box" x="625" y="180" width="220" height="95"/>
  <text class="text" x="672" y="210">RespCommandAdapter</text>
  <text class="small" x="672" y="235">RespExecutionAdapter</text>
  <text class="small" x="672" y="254">argv -> ExecutionRequest</text>

  <rect class="exec" x="910" y="180" width="195" height="95"/>
  <text class="text" x="942" y="210">Command execution</text>
  <text class="small" x="947" y="235">ExecutionRequest</text>
  <text class="small" x="947" y="254">ReplyWriter</text>

  <rect class="reply" x="625" y="350" width="220" height="95"/>
  <text class="text" x="678" y="380">RespReplyWriter</text>
  <text class="small" x="673" y="405">RESP2 by default</text>
  <text class="small" x="673" y="424">RESP3 after HELLO 3</text>

  <rect class="reply" x="340" y="350" width="220" height="95"/>
  <text class="text" x="385" y="380">Encoded reply bytes</text>
  <text class="mono" x="386" y="405">+OK\r\n  :1\r\n  %...</text>
  <text class="small" x="385" y="424">written back to TCP</text>

  <rect class="error" x="340" y="65" width="220" height="75"/>
  <text class="text" x="386" y="95">Malformed RESP</text>
  <text class="small" x="385" y="119">error reply + close-after-reply</text>

  <path class="arrow" d="M 275 168 C 305 175 320 195 340 214"/>
  <path class="arrow" d="M 275 312 C 305 300 320 260 340 242"/>
  <path class="arrow" d="M 560 228 L 625 228"/>
  <path class="arrow" d="M 845 228 L 910 228"/>
  <path class="arrow" d="M 1007 275 C 960 365 900 392 845 398"/>
  <path class="arrow" d="M 625 398 L 560 398"/>
  <path class="err-arrow" d="M 450 180 L 450 140"/>

  <line class="boundary" x1="590" y1="105" x2="590" y2="465"/>
  <text class="small" x="602" y="115">protocol DTO boundary</text>
  <line class="boundary" x1="875" y1="105" x2="875" y2="465"/>
  <text class="small" x="887" y="115">execution boundary</text>
</svg>
