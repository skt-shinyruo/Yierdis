<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 984" width="760" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L7 4 L1 7 Z" fill="#8b949e"/></marker>
  </defs>

  <rect x="260" y="20" width="240" height="40" rx="8" fill="#f6f8fa" stroke="#8b949e" stroke-width="1.5"/>
  <text x="380" y="45" text-anchor="middle" font-size="14" fill="#1f2328">YierdisNativePageAllocator</text>

  <rect x="40" y="100" width="150" height="70" rx="8" fill="#f6f8fa" stroke="#8b949e" stroke-width="1.5"/>
  <text x="115" y="132" text-anchor="middle" font-size="13" fill="#1f2328">nextPageId = 1</text>
  <text x="115" y="154" text-anchor="middle" font-size="12" fill="#57606a">池空时才发新 id</text>

  <rect x="400" y="100" width="240" height="70" rx="8" fill="#f6f8fa" stroke="#8b949e" stroke-width="1.5"/>
  <text x="520" y="124" text-anchor="middle" font-size="13" fill="#1f2328">reusablePageIds : TreeSet</text>
  <text x="520" y="142" text-anchor="middle" font-size="12" fill="#57606a">已回收待复用的 id；</text>
  <text x="520" y="158" text-anchor="middle" font-size="12" fill="#57606a">pollFirst() 取最小者并移除</text>

  <rect x="205" y="210" width="350" height="70" rx="8" fill="#f6f8fa" stroke="#8b949e" stroke-width="1.5"/>
  <text x="380" y="234" text-anchor="middle" font-size="13" fill="#1f2328">pagesById : TreeMap&lt;id, PageAllocation&gt;</text>
  <text x="380" y="252" text-anchor="middle" font-size="12" fill="#57606a">★ 唯一的「活页」注册表；</text>
  <text x="380" y="268" text-anchor="middle" font-size="12" fill="#57606a">get(id) == null 即表示该 id 已死</text>

  <rect x="40" y="330" width="300" height="84" rx="8" fill="#f6f8fa" stroke="#8b949e" stroke-width="1.5"/>
  <text x="190" y="354" text-anchor="middle" font-size="14" fill="#1f2328">SmallPage</text>
  <text x="190" y="372" text-anchor="middle" font-size="12" fill="#57606a">pageId / creationSequence / closed</text>
  <text x="190" y="388" text-anchor="middle" font-size="12" fill="#57606a">sizeClass / freeOffsets</text>
  <text x="190" y="404" text-anchor="middle" font-size="12" fill="#57606a">freeCount / liveBlocks</text>

  <rect x="420" y="330" width="300" height="84" rx="8" fill="#f6f8fa" stroke="#8b949e" stroke-width="1.5"/>
  <text x="570" y="360" text-anchor="middle" font-size="14" fill="#1f2328">SpanAllocation</text>
  <text x="570" y="378" text-anchor="middle" font-size="12" fill="#57606a">pageId / creationSequence / closed</text>
  <text x="570" y="396" text-anchor="middle" font-size="12" fill="#57606a">pageCount / pageClass / capacity</text>

  <rect x="260" y="460" width="240" height="56" rx="8" fill="#f6f8fa" stroke="#8b949e" stroke-width="1.5"/>
  <text x="380" y="484" text-anchor="middle" font-size="13" fill="#1f2328">YierdisFfmRegion</text>
  <text x="380" y="502" text-anchor="middle" font-size="12" fill="#57606a">(region 才是真正的堆外内存)</text>

  <rect x="230" y="560" width="300" height="70" rx="8" fill="#f6f8fa" stroke="#8b949e" stroke-width="1.5"/>
  <text x="380" y="584" text-anchor="middle" font-size="13" fill="#1f2328">off-heap 字节</text>
  <text x="380" y="602" text-anchor="middle" font-size="12" fill="#57606a">SmallPage: 64 KB，等长块 × N</text>
  <text x="380" y="618" text-anchor="middle" font-size="12" fill="#57606a">Span: pageCount × 64 KB，单块独占</text>

  <rect x="115" y="690" width="530" height="274" rx="8" fill="none" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="380" y="716" text-anchor="middle" font-size="13" fill="#57606a">YierdisNativeBlock —— 一次分配的客户端视图</text>

  <rect x="140" y="736" width="90" height="40" rx="8" fill="#f6f8fa" stroke="#8b949e" stroke-width="1.5"/>
  <text x="185" y="761" text-anchor="middle" font-size="13" fill="#1f2328">owner</text>
  <rect x="300" y="736" width="110" height="40" rx="8" fill="#f6f8fa" stroke="#8b949e" stroke-width="1.5"/>
  <text x="355" y="761" text-anchor="middle" font-size="13" fill="#1f2328">allocation</text>
  <rect x="470" y="736" width="90" height="40" rx="8" fill="#f6f8fa" stroke="#8b949e" stroke-width="1.5"/>
  <text x="515" y="761" text-anchor="middle" font-size="13" fill="#1f2328">region</text>

  <rect x="135" y="812" width="490" height="40" rx="8" fill="#f6f8fa" stroke="#8b949e" stroke-width="1.5"/>
  <text x="380" y="837" text-anchor="middle" font-size="12" fill="#1f2328">regionOffset / capacity / pageId / pageOffset / pageClass</text>

  <rect x="180" y="888" width="400" height="56" rx="8" fill="#f6f8fa" stroke="#8b949e" stroke-width="1.5"/>
  <text x="380" y="912" text-anchor="middle" font-size="12" fill="#1f2328">实际读写路径：region.getByte(regionOffset + index)</text>
  <text x="380" y="930" text-anchor="middle" font-size="12" fill="#57606a">★ 定位二元组 (pageId, pageOffset)</text>

  <polyline points="300,60 150,100" fill="none" stroke="#8b949e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="460,60 500,100" fill="none" stroke="#8b949e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="380" y1="60" x2="380" y2="210" stroke="#8b949e" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="460" y1="170" x2="460" y2="208" stroke="#8b949e" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="468" y="194" font-size="12" fill="#57606a">registerPage(id, allocation)</text>
  <line x1="280" y1="280" x2="190" y2="328" stroke="#8b949e" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line x1="480" y1="280" x2="570" y2="328" stroke="#8b949e" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line x1="280" y1="414" x2="320" y2="458" stroke="#8b949e" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="272" y="440" text-anchor="middle" font-size="12" fill="#57606a">region</text>
  <line x1="500" y1="414" x2="450" y2="458" stroke="#8b949e" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="500" y="440" text-anchor="middle" font-size="12" fill="#57606a">region</text>
  <line x1="380" y1="516" x2="380" y2="558" stroke="#8b949e" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <polyline points="140,756 24,756 24,40 258,40" fill="none" stroke="#8b949e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <text x="32" y="34" font-size="12" fill="#57606a">close 时回调 free</text>
  <polyline points="355,776 355,796 70,796 70,430 190,430 190,416" fill="none" stroke="#8b949e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <polyline points="380,776 380,796 690,796 690,430 570,430 570,416" fill="none" stroke="#8b949e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <polyline points="560,756 700,756 700,488 502,488" fill="none" stroke="#8b949e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <text x="536" y="596" font-size="12" fill="#57606a">与所属 PageAllocation</text>
  <text x="536" y="614" font-size="12" fill="#57606a">共享同一个 region</text>
  <line x1="380" y1="852" x2="380" y2="888" stroke="#8b949e" stroke-width="1.5" stroke-linecap="round"/>
</svg>
