<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 832" width="760" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L7 4 L1 7 Z" fill="#8b949e"/></marker>
  </defs>

  <rect x="267" y="20" width="225" height="40" rx="8" fill="#f6f8fa" stroke="#8b949e" stroke-width="1.5"/>
  <text x="380" y="45" text-anchor="middle" font-size="14" fill="#1f2328">allocate(requestedBytes)</text>

  <rect x="40" y="120" width="235" height="70" rx="8" fill="#f6f8fa" stroke="#8b949e" stroke-width="1.5"/>
  <text x="157" y="144" text-anchor="middle" font-size="13" fill="#1f2328">allocateSmall()</text>
  <text x="157" y="162" text-anchor="middle" font-size="12" fill="#57606a">forSize() → SizeClass</text>
  <text x="157" y="178" text-anchor="middle" font-size="12" fill="#57606a">findNonFullPage(sizeClass)</text>

  <rect x="505" y="120" width="215" height="70" rx="8" fill="#f6f8fa" stroke="#8b949e" stroke-width="1.5"/>
  <text x="612" y="144" text-anchor="middle" font-size="13" fill="#1f2328">allocateSpan()</text>
  <text x="612" y="162" text-anchor="middle" font-size="12" fill="#57606a">pagesFor() → pageCount</text>
  <text x="612" y="178" text-anchor="middle" font-size="12" fill="#57606a">claimPageId()</text>

  <rect x="60" y="250" width="140" height="56" rx="8" fill="#f6f8fa" stroke="#8b949e" stroke-width="1.5"/>
  <text x="130" y="274" text-anchor="middle" font-size="13" fill="#1f2328">popFreeOffset()</text>
  <text x="130" y="292" text-anchor="middle" font-size="12" fill="#57606a">liveBlocks++</text>

  <rect x="220" y="258" width="130" height="40" rx="8" fill="#f6f8fa" stroke="#8b949e" stroke-width="1.5"/>
  <text x="285" y="283" text-anchor="middle" font-size="13" fill="#1f2328">newSmallPage</text>

  <rect x="480" y="250" width="260" height="56" rx="8" fill="#f6f8fa" stroke="#8b949e" stroke-width="1.5"/>
  <text x="610" y="274" text-anchor="middle" font-size="13" fill="#1f2328">runtime.allocateRegion(</text>
  <text x="610" y="292" text-anchor="middle" font-size="12" fill="#57606a">MEDIUM_SPAN / LARGE_SPAN, cap)</text>

  <rect x="445" y="350" width="295" height="40" rx="8" fill="#f6f8fa" stroke="#8b949e" stroke-width="1.5"/>
  <text x="592" y="375" text-anchor="middle" font-size="13" fill="#1f2328">SpanAllocation(pageId, region, …)</text>

  <rect x="305" y="430" width="150" height="40" rx="8" fill="#f6f8fa" stroke="#8b949e" stroke-width="1.5"/>
  <text x="380" y="455" text-anchor="middle" font-size="13" fill="#1f2328">registerPage()</text>

  <rect x="155" y="520" width="450" height="146" rx="8" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/>
  <text x="380" y="544" text-anchor="middle" font-size="13" fill="#065f46">返回 YierdisNativeBlock：</text>
  <text x="380" y="562" text-anchor="middle" font-size="12" fill="#065f46">small: pageId = page.pageId, pageOffset = offset,</text>
  <text x="380" y="580" text-anchor="middle" font-size="12" fill="#065f46">regionOffset = offset, capacity = sizeClass.bytes(),</text>
  <text x="380" y="598" text-anchor="middle" font-size="12" fill="#065f46">pageClass = SMALL</text>
  <text x="380" y="616" text-anchor="middle" font-size="12" fill="#065f46">span : pageId = span.pageId, pageOffset = 0（恒定）,</text>
  <text x="380" y="634" text-anchor="middle" font-size="12" fill="#065f46">regionOffset = 0, capacity = span.capacity,</text>
  <text x="380" y="652" text-anchor="middle" font-size="12" fill="#065f46">pageClass = MEDIUM_SPAN / LARGE_SPAN</text>

  <rect x="170" y="720" width="420" height="92" rx="8" fill="#f6f8fa" stroke="#8b949e" stroke-width="1.5"/>
  <text x="380" y="744" text-anchor="middle" font-size="13" fill="#1f2328">releaseFailedAllocation()：</text>
  <text x="380" y="762" text-anchor="middle" font-size="12" fill="#57606a">从 registry 摘除（仅当 owner 仍是它）→ close region</text>
  <text x="380" y="780" text-anchor="middle" font-size="12" fill="#57606a">→ reusablePageIds.add(pageId) 退还 id → close 异常作为</text>
  <text x="380" y="798" text-anchor="middle" font-size="12" fill="#57606a">suppressed 挂在原异常上后重抛</text>

  <line x1="310" y1="60" x2="180" y2="116" stroke="#8b949e" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="128" y="88" font-size="12" fill="#57606a">≤ 32768 (B32768)</text>
  <line x1="450" y1="60" x2="590" y2="116" stroke="#8b949e" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="556" y="88" font-size="12" fill="#57606a">&gt; 32768</text>
  <line x1="130" y1="190" x2="130" y2="246" stroke="#8b949e" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="140" y="224" font-size="12" fill="#57606a">找到了</text>
  <line x1="200" y1="190" x2="266" y2="254" stroke="#8b949e" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="244" y="220" font-size="12" fill="#57606a">没找到</text>
  <line x1="612" y1="190" x2="612" y2="246" stroke="#8b949e" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line x1="610" y1="306" x2="600" y2="346" stroke="#8b949e" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <polyline points="560,390 560,410 430,410 430,426" fill="none" stroke="#8b949e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <text x="440" y="424" font-size="12" fill="#57606a">registerPage(pageId, span)</text>
  <line x1="285" y1="298" x2="340" y2="426" stroke="#8b949e" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <polyline points="130,306 130,450 301,450" fill="none" stroke="#8b949e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <line x1="380" y1="470" x2="380" y2="516" stroke="#8b949e" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line x1="380" y1="666" x2="380" y2="716" stroke="#8b949e" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="392" y="696" font-size="12" fill="#57606a">任何一步失败</text>
</svg>
