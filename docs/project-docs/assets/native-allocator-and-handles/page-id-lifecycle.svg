<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 612" width="760" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L7 4 L1 7 Z" fill="#8b949e"/></marker>
  </defs>

  <rect x="310" y="20" width="140" height="40" rx="8" fill="#f6f8fa" stroke="#8b949e" stroke-width="1.5"/>
  <text x="380" y="45" text-anchor="middle" font-size="14" fill="#1f2328">claimPageId()</text>

  <rect x="40" y="130" width="255" height="70" rx="8" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/>
  <text x="167" y="172" text-anchor="middle" font-size="13" fill="#065f46">reusablePageIds.pollFirst()</text>

  <rect x="425" y="130" width="315" height="70" rx="8" fill="#f6f8fa" stroke="#8b949e" stroke-width="1.5"/>
  <text x="582" y="152" text-anchor="middle" font-size="13" fill="#1f2328">nextPageId++</text>
  <text x="582" y="170" text-anchor="middle" font-size="12" fill="#57606a">（到 MAX_VALUE 置 -1，下次抛</text>
  <text x="582" y="186" text-anchor="middle" font-size="12" fill="#57606a">native page id space exhausted）</text>

  <rect x="175" y="260" width="410" height="70" rx="8" fill="#f6f8fa" stroke="#8b949e" stroke-width="1.5"/>
  <text x="380" y="284" text-anchor="middle" font-size="13" fill="#1f2328">registerPage(id, alloc)</text>
  <text x="380" y="302" text-anchor="middle" font-size="12" fill="#57606a">pagesById.put(id, alloc)</text>
  <text x="380" y="318" text-anchor="middle" font-size="12" fill="#57606a">putIfAbsent != null 即抛 "page id is already live"</text>

  <rect x="205" y="390" width="350" height="56" rx="8" fill="#f6f8fa" stroke="#8b949e" stroke-width="1.5"/>
  <text x="380" y="414" text-anchor="middle" font-size="13" fill="#1f2328">服务期：pagesById.get(id) → PageAllocation</text>
  <text x="380" y="432" text-anchor="middle" font-size="12" fill="#57606a">← 所有 (pageId, pageOffset) 查表都走这里</text>

  <rect x="120" y="500" width="520" height="92" rx="8" fill="#f6f8fa" stroke="#8b949e" stroke-width="1.5"/>
  <text x="380" y="524" text-anchor="middle" font-size="13" fill="#1f2328">removePage(id, expected, recycleId = true)</text>
  <text x="380" y="542" text-anchor="middle" font-size="12" fill="#57606a">1. pagesById.get(id) != expected → "page id owner mismatch"</text>
  <text x="380" y="560" text-anchor="middle" font-size="12" fill="#57606a">2. pagesById.remove(id) ★ 从此刻 null</text>
  <text x="380" y="578" text-anchor="middle" font-size="12" fill="#57606a">3. reusablePageIds.add(id) 返回 false → "page id is already reusable"</text>

  <line x1="340" y1="60" x2="192" y2="126" stroke="#8b949e" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="204" y="92" font-size="12" fill="#57606a">池里有货</text>
  <line x1="420" y1="60" x2="558" y2="126" stroke="#8b949e" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="520" y="92" font-size="12" fill="#57606a">池空</text>
  <line x1="167" y1="200" x2="278" y2="256" stroke="#8b949e" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line x1="582" y1="200" x2="482" y2="256" stroke="#8b949e" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line x1="380" y1="330" x2="380" y2="386" stroke="#8b949e" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line x1="380" y1="446" x2="380" y2="496" stroke="#8b949e" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="392" y="468" font-size="12" fill="#57606a">block.close() / freeSmall / freeSpan /</text>
  <text x="392" y="486" font-size="12" fill="#57606a">trimEmptyPages / scope abort</text>
  <polyline points="120,546 30,546 30,165 36,165" fill="none" stroke="#8b949e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <text x="38" y="358" font-size="12" fill="#57606a">回到 pollFirst() 等待复用</text>
</svg>
