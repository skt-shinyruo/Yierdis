<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="620" viewBox="0 0 1160 620" role="img" aria-labelledby="title desc">
  <title id="title">Command executor and backpressure</title>
  <desc id="desc">A diagram showing channel input, submitter checks, backlog budget, task queue, owner thread drain, reply write, and autoRead backpressure recovery.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2d5f85"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { fill: #0f172a; font: 700 28px sans-serif; }
      .text { fill: #0f172a; font: 15px sans-serif; }
      .small { fill: #475569; font: 13px sans-serif; }
      .box { fill: #eef6fb; stroke: #2d5f85; stroke-width: 1.5; rx: 12; }
      .queue { fill: #fff6e8; stroke: #9a6b1f; stroke-width: 1.5; rx: 12; }
      .exec { fill: #f2f8ed; stroke: #4f7d3a; stroke-width: 1.5; rx: 12; }
      .pressure { fill: #fef2f2; stroke: #b91c1c; stroke-width: 1.5; rx: 12; }
      .arrow { stroke: #2d5f85; stroke-width: 2; marker-end: url(#arrow); fill: none; }
      .warn { stroke: #b91c1c; stroke-width: 2; marker-end: url(#arrow); fill: none; stroke-dasharray: 7 5; }
      .recover { stroke: #4f7d3a; stroke-width: 2; marker-end: url(#arrow); fill: none; stroke-dasharray: 7 5; }
    </style>
  </defs>
  <rect class="bg" width="1160" height="620"/>
  <text class="title" x="40" y="42">Executor And Backpressure</text>
  <text class="small" x="40" y="70">Requests are accepted by budget, drained on the owner thread, and throttled by read-side backpressure.</text>

  <rect class="box" x="55" y="140" width="190" height="76"/>
  <text class="text" x="93" y="170">Netty channel</text>
  <text class="small" x="83" y="194">read RESP request</text>

  <rect class="box" x="300" y="140" width="210" height="76"/>
  <text class="text" x="335" y="170">FastCommandHandler</text>
  <text class="small" x="340" y="194">trySubmit(request)</text>

  <rect class="queue" x="565" y="95" width="230" height="76"/>
  <text class="text" x="610" y="125">BacklogBudget</text>
  <text class="small" x="602" y="149">slots + queued bytes</text>

  <rect class="queue" x="565" y="225" width="230" height="76"/>
  <text class="text" x="615" y="255">ExecutorTaskQueue</text>
  <text class="small" x="610" y="279">GLOBAL FIFO or FAIR</text>

  <rect class="exec" x="850" y="170" width="245" height="88"/>
  <text class="text" x="892" y="203">Owner thread drain</text>
  <text class="small" x="889" y="227">max commands / time budget</text>

  <rect class="exec" x="850" y="325" width="245" height="88"/>
  <text class="text" x="890" y="358">ExecutionSupport</text>
  <text class="small" x="885" y="382">engine.execute + reply write</text>

  <rect class="pressure" x="300" y="345" width="210" height="92"/>
  <text class="text" x="338" y="377">BackpressureController</text>
  <text class="small" x="333" y="401">disable/enable autoRead</text>
  <text class="small" x="333" y="421">global recovery scan</text>

  <rect class="pressure" x="55" y="345" width="190" height="92"/>
  <text class="text" x="83" y="377">Connection context</text>
  <text class="small" x="86" y="401">pending / bytes</text>
  <text class="small" x="86" y="421">closing / transport state</text>

  <rect class="pressure" x="565" y="395" width="230" height="92"/>
  <text class="text" x="598" y="427">Write buffer pressure</text>
  <text class="small" x="596" y="451">channel unwritable</text>
  <text class="small" x="596" y="471">slow-client grace close</text>

  <path class="arrow" d="M 245 178 L 300 178"/>
  <path class="arrow" d="M 510 178 C 535 160 545 145 565 133"/>
  <path class="arrow" d="M 680 171 L 680 225"/>
  <path class="arrow" d="M 795 263 C 835 250 845 230 850 214"/>
  <path class="arrow" d="M 972 258 L 972 325"/>
  <path class="arrow" d="M 850 369 C 730 365 665 325 680 301"/>
  <text class="small" x="673" y="350">release slot / bytes</text>

  <path class="warn" d="M 405 216 L 405 345"/>
  <text class="small" x="420" y="284">high watermark</text>
  <path class="warn" d="M 245 391 L 300 391"/>
  <path class="warn" d="M 795 441 C 840 440 860 420 850 395"/>
  <path class="warn" d="M 680 395 L 680 301"/>

  <path class="recover" d="M 510 391 C 605 525 205 528 150 437"/>
  <text class="small" x="270" y="536">recover only when global and connection-local pressure are both low</text>
</svg>
