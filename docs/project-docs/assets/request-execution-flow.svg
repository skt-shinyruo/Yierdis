<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="620" viewBox="0 0 1160 620" role="img" aria-labelledby="title desc">
  <title id="title">Yierdis request execution flow</title>
  <desc id="desc">A left-to-right diagram from RESP bytes through protocol, server, executor, engine, command, DB storage, and reply flush.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2d5f85"/>
    </marker>
    <style>
      .bg { fill: #f7fafc; }
      .lane { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
      .lane-title { fill: #334155; font: 700 18px sans-serif; }
      .box { fill: #eef6fb; stroke: #2d5f85; stroke-width: 1.5; rx: 10; }
      .box-alt { fill: #f2f8ed; stroke: #4f7d3a; stroke-width: 1.5; rx: 10; }
      .box-db { fill: #fff6e8; stroke: #9a6b1f; stroke-width: 1.5; rx: 10; }
      .text { fill: #0f172a; font: 15px sans-serif; }
      .small { fill: #475569; font: 13px sans-serif; }
      .arrow { stroke: #2d5f85; stroke-width: 2; marker-end: url(#arrow); fill: none; }
      .boundary { stroke: #94a3b8; stroke-width: 1.4; stroke-dasharray: 6 6; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1160" height="620"/>
  <text x="40" y="42" fill="#0f172a" font-family="sans-serif" font-size="28" font-weight="700">Request Execution Flow</text>
  <text x="40" y="70" class="small">Protocol, server glue, executor scheduling, command dispatch, storage, and write-back each stop at a clear boundary.</text>

  <rect class="lane" x="40" y="105" width="245" height="430" rx="14"/>
  <text class="lane-title" x="70" y="140">Protocol</text>
  <rect class="box" x="70" y="155" width="185" height="45"/>
  <text class="text" x="91" y="183">Netty ByteBuf</text>
  <rect class="box" x="70" y="231" width="185" height="45"/>
  <text class="text" x="91" y="259">RespRequestDecoder</text>
  <rect class="box" x="70" y="307" width="185" height="45"/>
  <text class="text" x="88" y="335">RespCommandRequest</text>
  <rect class="box" x="70" y="383" width="185" height="45"/>
  <text class="text" x="91" y="411">RespCommandAdapter</text>

  <rect class="lane" x="335" y="105" width="220" height="430" rx="14"/>
  <text class="lane-title" x="365" y="140">Server</text>
  <rect class="box" x="365" y="145" width="160" height="52"/>
  <text class="text" x="391" y="166">RespExecution</text>
  <text class="text" x="418" y="185">Adapter</text>
  <rect class="box" x="365" y="221" width="160" height="52"/>
  <text class="text" x="383" y="242">ByteArrayExecution</text>
  <text class="text" x="405" y="261">Request</text>
  <rect class="box" x="365" y="297" width="160" height="52"/>
  <text class="text" x="385" y="318">ExecutionRequest</text>
  <text class="text" x="415" y="337">contract</text>
  <rect class="box" x="365" y="373" width="160" height="52"/>
  <text class="text" x="386" y="405">FastCommandHandler</text>
  <rect class="box" x="365" y="449" width="160" height="52"/>
  <text class="text" x="392" y="481">Reply Adapter</text>

  <rect class="lane" x="605" y="105" width="245" height="430" rx="14"/>
  <text class="lane-title" x="635" y="140">Executor / Engine</text>
  <rect class="box-alt" x="635" y="169" width="185" height="52"/>
  <text class="text" x="663" y="201">trySubmit + budget</text>
  <rect class="box-alt" x="635" y="281" width="185" height="52"/>
  <text class="text" x="663" y="313">owner thread drain</text>
  <rect class="box-alt" x="635" y="393" width="185" height="52"/>
  <text class="text" x="659" y="425">YierdisEngine.execute</text>

  <rect class="lane" x="900" y="105" width="220" height="430" rx="14"/>
  <text class="lane-title" x="930" y="140">Command / DB</text>
  <rect class="box-alt" x="930" y="169" width="160" height="52"/>
  <text class="text" x="953" y="201">CommandSpec parse</text>
  <rect class="box-alt" x="930" y="281" width="160" height="52"/>
  <text class="text" x="955" y="313">typed handler</text>
  <rect class="box-db" x="930" y="393" width="160" height="52"/>
  <text class="text" x="952" y="425">DB / storage</text>

  <path class="arrow" d="M 162.5 200 L 162.5 231"/>
  <path class="arrow" d="M 162.5 276 L 162.5 307"/>
  <path class="arrow" d="M 162.5 352 L 162.5 383"/>
  <path class="arrow" d="M 255 405 L 365 171"/>
  <path class="arrow" d="M 445 197 L 445 221"/>
  <path class="arrow" d="M 445 273 L 445 297"/>
  <path class="arrow" d="M 445 349 L 445 373"/>
  <path class="arrow" d="M 525 399 L 635 195"/>
  <path class="arrow" d="M 727.5 221 L 727.5 281"/>
  <path class="arrow" d="M 727.5 333 L 727.5 393"/>
  <path class="arrow" d="M 820 419 L 930 195"/>
  <path class="arrow" d="M 1010 221 L 1010 281"/>
  <path class="arrow" d="M 1010 333 L 1010 393"/>

  <path class="arrow" d="M 930 419 C 735 555 610 555 525 475"/>
  <text class="small" x="480" y="575">ReplyWriter -> RespReplyWriter -> NettyExecutionIoAdapter -> transport flush</text>

  <line class="boundary" x1="310" y1="115" x2="310" y2="525"/>
  <line class="boundary" x1="580" y1="115" x2="580" y2="525"/>
  <line class="boundary" x1="875" y1="115" x2="875" y2="525"/>
</svg>
