<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="520" viewBox="0 0 1160 520" role="img" aria-labelledby="title desc">
  <title id="title">Yierdis request execution flow</title>
  <desc id="desc">A left-to-right diagram from RESP bytes through protocol, server, executor, engine, command, DB storage, and reply flush.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2d5f85"/>
    </marker>
    <style>
      .bg { fill: #f7fafc; }
      .lane { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
      .lane-title { fill: #334155; font: 700 18px sans-serif; }
      .box { fill: #eef6fb; stroke: #2d5f85; stroke-width: 1.5; rx: 10; }
      .box-alt { fill: #f2f8ed; stroke: #4f7d3a; stroke-width: 1.5; rx: 10; }
      .box-db { fill: #fff6e8; stroke: #9a6b1f; stroke-width: 1.5; rx: 10; }
      .text { fill: #0f172a; font: 15px sans-serif; }
      .small { fill: #475569; font: 13px sans-serif; }
      .arrow { stroke: #2d5f85; stroke-width: 2; marker-end: url(#arrow); fill: none; }
      .boundary { stroke: #94a3b8; stroke-width: 1.4; stroke-dasharray: 6 6; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1160" height="520"/>
  <text x="40" y="42" fill="#0f172a" font-family="sans-serif" font-size="28" font-weight="700">Request Execution Flow</text>
  <text x="40" y="70" class="small">Protocol, server glue, executor scheduling, command dispatch, storage, and write-back each stop at a clear boundary.</text>

  <rect class="lane" x="40" y="105" width="245" height="310" rx="14"/>
  <text class="lane-title" x="70" y="140">Protocol</text>
  <rect class="box" x="70" y="165" width="185" height="52"/>
  <text class="text" x="91" y="197">Netty ByteBuf</text>
  <rect class="box" x="70" y="244" width="185" height="52"/>
  <text class="text" x="91" y="276">RespRequestDecoder</text>
  <rect class="box" x="70" y="323" width="185" height="52"/>
  <text class="text" x="91" y="355">RespCommandAdapter</text>

  <rect class="lane" x="335" y="105" width="220" height="310" rx="14"/>
  <text class="lane-title" x="365" y="140">Server</text>
  <rect class="box" x="365" y="165" width="160" height="52"/>
  <text class="text" x="392" y="197">ExecutionRequest</text>
  <rect class="box" x="365" y="244" width="160" height="52"/>
  <text class="text" x="386" y="276">FastCommandHandler</text>
  <rect class="box" x="365" y="323" width="160" height="52"/>
  <text class="text" x="392" y="355">Reply Adapter</text>

  <rect class="lane" x="605" y="105" width="245" height="310" rx="14"/>
  <text class="lane-title" x="635" y="140">Executor / Engine</text>
  <rect class="box-alt" x="635" y="165" width="185" height="52"/>
  <text class="text" x="663" y="197">trySubmit + budget</text>
  <rect class="box-alt" x="635" y="244" width="185" height="52"/>
  <text class="text" x="663" y="276">owner thread drain</text>
  <rect class="box-alt" x="635" y="323" width="185" height="52"/>
  <text class="text" x="659" y="355">YierdisEngine.execute</text>

  <rect class="lane" x="900" y="105" width="220" height="310" rx="14"/>
  <text class="lane-title" x="930" y="140">Command / DB</text>
  <rect class="box-alt" x="930" y="165" width="160" height="52"/>
  <text class="text" x="953" y="197">CommandSpec parse</text>
  <rect class="box-alt" x="930" y="244" width="160" height="52"/>
  <text class="text" x="955" y="276">typed handler</text>
  <rect class="box-db" x="930" y="323" width="160" height="52"/>
  <text class="text" x="952" y="355">DB / storage</text>

  <path class="arrow" d="M 162.5 217 L 162.5 244"/>
  <path class="arrow" d="M 162.5 296 L 162.5 323"/>
  <path class="arrow" d="M 255 349 L 365 191"/>
  <path class="arrow" d="M 445 217 L 445 244"/>
  <path class="arrow" d="M 525 270 L 635 191"/>
  <path class="arrow" d="M 727.5 217 L 727.5 244"/>
  <path class="arrow" d="M 727.5 296 L 727.5 323"/>
  <path class="arrow" d="M 820 349 L 930 191"/>
  <path class="arrow" d="M 1010 217 L 1010 244"/>
  <path class="arrow" d="M 1010 296 L 1010 323"/>

  <path class="arrow" d="M 930 355 C 720 465 520 465 365 355"/>
  <text class="small" x="542" y="472">ReplyWriter -> RespReplyWriter -> transport flush</text>

  <line class="boundary" x1="310" y1="115" x2="310" y2="405"/>
  <line class="boundary" x1="580" y1="115" x2="580" y2="405"/>
  <line class="boundary" x1="875" y1="115" x2="875" y2="405"/>
</svg>
